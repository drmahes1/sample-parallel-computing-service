name: pcs-component
description: Creates a PCS AMI.
schemaVersion: 1.0

parameters:
  - Region:
      type: string
      default: 'us-east-2'
      description: AWS Region to build in
  - BucketName:
      type: string
      default: 'pcs-wrf'
      description: Input parameter specifying the bucket name
  - PCSVersion:
      type: string
      default: 'v1'
      description: PCS Agent version
  - SlurmVersion:
      type: string
      description: Slurm version
  - EFAVersion:
      type: string
      default: '1.47.0'
      description: EFA version
  - EnrootVersion:
      type: string
      default: '4.0.1-1'
      description: Enroot version
  - ZFSDNS:
      type: string
      description: OpenZFS DNS name
  - ZFSMnt:
      type: string
      default: '/fsx'
      description: OpenZFS mount point
  - LDAPDNS:
      type: string
      description: The private DNS address of the LDAP server
  - LDAPPassword:
      type: string
      description: The password to bind to LDAP


phases:
  - name: build
    steps:

      - name: UpdateOS
        action: UpdateOS

      - name: TurnOffSRSO
        action: ExecuteBash
        inputs:
          commands:
            - |
              grubby --update-kernel=ALL --args='spec_rstack_overflow=off'

      - name: GetPCSAgent
        action: WebDownload
        inputs:
          - source: https://aws-pcs-repo-{{ Region }}.s3.{{ Region }}.amazonaws.com/aws-pcs-agent/aws-pcs-agent-{{ PCSVersion }}-latest.tar.gz
            destination: /tmp/aws-pcs-agent-{{ PCSVersion }}-latest.tar.gz
            overwrite: true

      - name: InstallPCSAgent
        action: ExecuteBash
        inputs:
          commands:
            - |
              cd /tmp
              tar xf aws-pcs-agent-{{ PCSVersion }}-latest.tar.gz
              export HOME=/tmp
              cd aws-pcs-agent
              ./installer.sh
              cd /tmp
              rm -rf aws-pcs-agent  aws-pcs-agent-{{ PCSVersion }}-latest.tar.gz

      - name: GetSlurm
        action: WebDownload
        inputs:
          - source: https://aws-pcs-repo-{{ Region }}.s3.{{ Region }}.amazonaws.com/aws-pcs-slurm/aws-pcs-slurm-{{ SlurmVersion }}-installer-latest.tar.gz
            destination: /tmp/aws-pcs-slurm-{{ SlurmVersion }}-installer-latest.tar.gz
            overwrite: true

      - name: InstallSlurm
        action: ExecuteBash
        inputs:
          commands:
            - |
              cd /tmp
              tar xf /tmp/aws-pcs-slurm-{{ SlurmVersion }}-installer-latest.tar.gz
              export HOME=/tmp
              cd aws-pcs-slurm-{{ SlurmVersion }}-installer
              ./installer.sh -y
              cd /tmp
              rm -rf aws-pcs-slurm-{{ SlurmVersion }}-installer  aws-pcs-slurm-{{ SlurmVersion }}-installer-latest.tar.gz

      - name: GetEFA
        action: WebDownload
        inputs:
          - source: https://efa-installer.amazonaws.com/aws-efa-installer-{{ EFAVersion }}.tar.gz
            destination: /tmp/aws-efa-installer-{{ EFAVersion }}.tar.gz
            overwrite: true

      - name: InstallEFA
        action: ExecuteBash
        inputs:
          commands:
            - |
              cd /tmp
              tar xf /tmp/aws-efa-installer-{{ EFAVersion }}.tar.gz
              export HOME=/tmp SYSTEMCTL=/bin/systemctl
              cd aws-efa-installer
              ./efa_installer.sh -y
              cd /tmp
              rm -rf aws-efa-installer  aws-efa-installer-{{ EFAVersion }}.tar.gz

      - name: EnableNonRootGPUProfiling
        # Drop the NVIDIA driver restriction that blocks non-root users from
        # reading GPU performance counters (required by ncu, nvprof, Nsight
        # Compute in user jobs). Takes effect on first boot of the resulting
        # AMI — the initramfs change doesn't apply inside the builder VM.
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              mkdir -p /etc/modprobe.d
              cat > /etc/modprobe.d/nvidia-profiling.conf << 'EOF'
              options nvidia NVreg_RestrictProfilingToAdminUsers=0
              EOF
              dracut --force

      - name: EnableDCGMOnBoot
        # DLAMI installs DCGM (dcgmi / nv-hostengine binaries) but the systemd
        # unit name varies across DCGM versions, and on some DLAMI releases
        # no unit is shipped at all. Try a few known names; if none exists,
        # log a warning and keep going — this step must not fail the bake.
        # To enable DCGM later, run `systemctl enable --now <unit>` on a live
        # node or bake an updated unit into the AMI.
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -uo pipefail
              units=$(systemctl list-unit-files --no-legend | awk '{print $1}')
              for candidate in nvidia-dcgm.service dcgm.service nv-hostengine.service nvidia-dcgm-exporter.service; do
                if echo "$units" | grep -q "^${candidate}$"; then
                  echo "Enabling $candidate"
                  systemctl enable "$candidate"
                  exit 0
                fi
              done
              echo "INFO: no DCGM systemd unit found on this base AMI; skipping auto-enable."
              exit 0

      - name: InstallLustre
        action: ExecuteBash
        inputs:
          commands:
            - |
              dnf install -y lustre-client

      - name: InstallEFS
        action: ExecuteBash
        inputs:
          commands:
            - |
              dnf install -y amazon-efs-utils

      - name: InstallCloudWatchAgent
        # Installs the binary only. The agent is NOT enabled/started at AMI
        # bake time — compute node launch templates start it so login nodes
        # (which reuse this AMI) do not push metrics.
        action: ExecuteBash
        inputs:
          commands:
            - |
              yum install -y amazon-cloudwatch-agent

      - name: DownloadCloudWatchAgentConfig
        # Drop the CWA config file (nvidia_gpu + cpu + mem) at the standard
        # location. Compute-node userdata later runs `amazon-cloudwatch-agent-ctl`
        # against this file to start the agent.
        action: S3Download
        inputs:
          - source: s3://{{ BucketName }}/cwa-config.json
            destination: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
            overwrite: true

      - name: InstallPyxisEnroot
        action: ExecuteBash
        inputs:
          commands:
            - |
              arch=$(uname -m)
              dnf install -y https://github.com/NVIDIA/enroot/releases/download/v4.0.1/enroot-{{ EnrootVersion }}.el8.${arch}.rpm
              dnf install -y https://github.com/NVIDIA/enroot/releases/download/v4.0.1/enroot+caps-{{ EnrootVersion }}.el8.${arch}.rpm
              cat > /etc/enroot/enroot.conf << EOF
              ENROOT_RUNTIME_PATH        /tmp/enroot/user-\$(id -u)
              ENROOT_CONFIG_PATH         \${HOME}/.config/enroot
              ENROOT_CACHE_PATH          \${HOME}/.cache/enroot
              ENROOT_DATA_PATH           /tmp/enroot/data/user-\$(id -u)
              ENROOT_TEMP_PATH           \${TMPDIR:-/tmp}
              EOF
              cat > /etc/enroot/hooks.d/50-slurm-pmi.sh << EOF
              #!/usr/bin/bash
              PATH=$PATH:/opt/aws/pcs/scheduler/slurm-{{ SlurmVersion }}/bin
              EOF
              cp /etc/enroot/hooks.d/50-slurm-pmi.sh /etc/enroot/hooks.d/50-slurm-pytorch.sh
              sed -n '2,$p' /usr/share/enroot/hooks.d/slurm/50-slurm-pmi.sh >> /etc/enroot/hooks.d/50-slurm-pmi.sh
              sed -n '2,$p' /usr/share/enroot/hooks.d/slurm/50-slurm-pytorch.sh >> /etc/enroot/hooks.d/50-slurm-pytorch.sh
              chmod 755 /etc/enroot/hooks.d/50-slurm-pmi.sh /etc/enroot/hooks.d/50-slurm-pytorch.sh
              cd /tmp
              git clone https://github.com/NVIDIA/pyxis
              cd pyxis
              make CFLAGS="-fPIC -I/opt/aws/pcs/scheduler/slurm-{{ SlurmVersion }}/include"
              cp spank_pyxis.so /opt/aws/pcs/scheduler/slurm-{{ SlurmVersion }}/lib/slurm/
              echo "required /opt/aws/pcs/scheduler/slurm-{{ SlurmVersion }}/lib/slurm/spank_pyxis.so" > /etc/aws/pcs/scheduler/slurm-{{ SlurmVersion }}/plugstack.conf.d/pyxis.conf

      - name: MountOpenZFS
        action: ExecuteBash
        inputs:
          commands:
            - |
              cd /home
              tar cf - * > /tmp/home.tar
              cd /
              echo "{{ ZFSDNS }}:{{ ZFSMnt }}/sw /sw nfs noatime,nfsvers=4.2,sync,nconnect=16,rsize=1048576,wsize=1048576 0 0" >> /etc/fstab
              echo "{{ ZFSDNS }}:{{ ZFSMnt }}/home /home nfs noatime,nfsvers=4.2,sync,nconnect=16,rsize=1048576,wsize=1048576 0 0" >> /etc/fstab
              mount /home
              cd /home
              tar xf /tmp/home.tar

      - name: InstallLDAPClient
        action: ExecuteBash
        inputs:
          commands:
            - |
              dnf install -y authselect openldap-clients openldap nss_ldap sssd sssd-ldap oddjob-mkhomedir
              echo "BASE    dc=my-domain,dc=com" >> /etc/openldap/ldap.conf
              echo "URI     ldap://{{ LDAPDNS }}" >> /etc/openldap/ldap.conf
              cp /etc/openldap/ldap.conf /etc/ldap.conf
              cat > /etc/sssd/sssd.conf << EOF
              [sssd]
              config_file_version = 2
              domains = my-domain.com
              services = nss,pam,sudo,ssh

              [domain/my-domain.com]
              id_provider = ldap
              auth_provider = ldap
              sudo_provider = ldap
              ldap_uri = ldap://{{ LDAPDNS }}
              cache_credentials = False
              entry_cache_timeout = 600
              ldap_search_base = DC=my-domain,DC=com
              ldap_default_bind_dn = cn=Manager,dc=my-domain,dc=com
              ldap_default_authtok_type = password
              ldap_default_authtok = {{ LDAPPassword }}
              ldap_sudo_search_base = ou=sudoers,dc=my-domain,dc=com

              [nss]
              homedir_substring = /home
              EOF
              chmod 600 /etc/sssd/sssd.conf
              authselect select sssd with-mkhomedir with-sudo --force
              systemctl enable --now sssd
              systemctl enable --now oddjobd.service
              sed -i '/AuthorizedKeysCommand/d' /etc/ssh/sshd_config
              echo "AuthorizedKeysCommand /usr/bin/sss_ssh_authorizedkeys" >> /etc/ssh/sshd_config
              echo "AuthorizedKeysCommandUser nobody" >> /etc/ssh/sshd_config

      - name: PublishPipelinePaths
        # Publish absolute paths to GPU profiling tools shipped by the DLAMI
        # so the gpu-benchmark-pipeline (sibling project) can source them
        # without depending on PATH or per-host autodetection.
        # Variables are env-only (no command execution) so the file is safe
        # on the login node as well as compute nodes, even though the login
        # node has no GPU hardware.
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              cat > /etc/profile.d/pipeline-paths.sh << 'EOF'
              # Cluster-published absolute paths for the gpu-benchmark-pipeline.
              # Pipeline run scripts source this file at startup; do not edit
              # by hand.
              export PIPELINE_NSYS=/opt/nvidia/nsight-systems/2025.6.1/bin/nsys
              export PIPELINE_NCU=/usr/local/cuda-12.9/bin/ncu
              export PIPELINE_NVCC=/usr/local/cuda-12.9/bin/nvcc
              export PIPELINE_CUDA_DEMO_SUITE=/usr/local/cuda-12.9/extras/demo_suite
              export PIPELINE_DCGMI=/usr/bin/dcgmi
              EOF
              chmod 644 /etc/profile.d/pipeline-paths.sh

      - name: CleanupCloudInitState
        # CRITICAL: cloud-init caches per-instance state under
        # /var/lib/cloud/instances/<instance-id>. The Image Builder VM's
        # instance-id leaks into the baked AMI via that cache. When a new
        # instance boots from this AMI, cloud-init sees "instance-id matches
        # cached data" and SKIPS first-boot modules including ssh_authkey,
        # which leaves /home/ec2-user/.ssh/authorized_keys empty. Users then
        # can't SSH in as ec2-user.
        #
        # Wiping the cache forces cloud-init to treat every boot as first-boot
        # for the new instance. MUST be the last bake step so nothing after it
        # repopulates the cache.
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euxo pipefail
              # Wipe cloud-init state so the AMI is a clean template.
              cloud-init clean --logs --seed || true
              rm -rf /var/lib/cloud/instances/* /var/lib/cloud/data/* /var/lib/cloud/sem/* || true
              rm -f /var/log/cloud-init.log /var/log/cloud-init-output.log || true
              # Host SSH keys get regenerated on first boot if missing, so
              # clear these too to avoid every instance having the same keys.
              rm -f /etc/ssh/ssh_host_* || true


